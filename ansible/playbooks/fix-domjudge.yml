---
# For source installs with the judgehost/ prefix and upstream sudoers rules.
# Use to provision judgehost API credentials and daemon run accounts.
# Site-specific sudoers/chroot ownership fixes depend on the installed version.
- name: Configure the DOMjudge judgehost
  hosts: judgehosts
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    domjudge_dir: /opt/domjudge
    domjudge_user: domjudge
    api_user: judgehost

  vars_prompt:
    - name: api_url
      prompt: "Enter the DOMjudge HTTP(S) API URL"
      private: false
    - name: api_pass
      prompt: "Enter the judgehost API password"
      private: true

  pre_tasks:
    - name: Require valid API credentials
      ansible.builtin.assert:
        that:
          - (api_url | default('') | urlsplit('scheme')) in ['http', 'https']
          - (api_url | urlsplit('hostname')) is string
          - api_url is match('^\S+$')
          - (api_user | default('')) is match('^\S+$')
          - (api_pass | default('')) is match('^\S+$')
      no_log: true

    - name: Validate the requested judge daemon account numbers
      ansible.builtin.assert:
        that:
          - domjudge_run_ids is sequence and domjudge_run_ids is not string and domjudge_run_ids is not mapping
          - domjudge_run_ids | length > 0
          - domjudge_run_ids | map('string') | reject('match', '^(0|[1-9][0-9]*)$') | list | length == 0
          - domjudge_run_ids | map('string') | unique | list | length == domjudge_run_ids | length
        fail_msg: "Set domjudge_run_ids to the judge daemon numbers for this host."

    - name: Verify the upstream sudo rule for runguard
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -l
          - -U
          - "{{ domjudge_user }}"
          - --
          - "{{ domjudge_dir }}/judgehost/bin/runguard"
      changed_when: false
      check_mode: false

  tasks:
    - name: Use normal executable permissions for runguard
      ansible.builtin.file:
        path: "{{ domjudge_dir }}/judgehost/bin/runguard"
        owner: root
        group: "{{ domjudge_user }}"
        mode: "0755"
        state: file

    - name: Write judgehost API credentials
      ansible.builtin.copy:
        dest: "{{ domjudge_dir }}/judgehost/etc/restapi.secret"
        content: "default {{ api_url }} {{ api_user }} {{ api_pass }}\n"
        owner: "{{ domjudge_user }}"
        mode: "0600"
      no_log: true
      diff: false

    - name: Ensure the shared domjudge-run group exists
      ansible.builtin.group:
        name: domjudge-run
        state: present
      register: domjudge_run_group

    - name: Configure unprivileged judge daemon accounts
      ansible.builtin.user:
        name: "domjudge-run-{{ item }}"
        groups: domjudge-run
        append: true
        home: /nonexistent
        create_home: false
        shell: /bin/false
        state: present
      loop: "{{ domjudge_run_ids }}"
      when: not (ansible_check_mode and domjudge_run_group is changed)
