---
# Replaces all existing UFW rules with the contest policy, one host at a time.
- name: Restrict network access on contestant machines
  hosts: contestants
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Read the management SSH connection
      ansible.builtin.command: printenv SSH_CONNECTION
      become: false
      register: management_ssh
      changed_when: false

    - name: Refuse rules that would lock out the current SSH connection
      ansible.builtin.assert:
        that: management_ssh.stdout.split()[0] | ip_in_network(ufw_management_network)
        fail_msg: "ufw_management_network must contain {{ management_ssh.stdout.split()[0] }}."

    - name: Ensure UFW is installed
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Reset UFW
      community.general.ufw:
        state: reset

    - name: Allow SSH from the management network
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: "{{ ufw_management_network }}"
        to_port: "{{ management_ssh.stdout.split()[3] }}"
        proto: tcp

    - name: Allow the configured outbound services
      community.general.ufw:
        rule: allow
        direction: out
        to_ip: "{{ item.ip }}"
        to_port: "{{ item.port }}"
        proto: "{{ item.proto | default('tcp') }}"
      loop: "{{ ufw_outbound_rules }}"

    - name: Deny other inbound and outbound traffic
      community.general.ufw:
        direction: "{{ item }}"
        policy: deny
      loop: [incoming, outgoing]

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Drop the existing SSH connection
      ansible.builtin.meta: reset_connection

    - name: Verify a fresh SSH connection before moving to the next host
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        timeout: 15
