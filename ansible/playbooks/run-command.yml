---
- name: Run a shell command on contestant machines
  hosts: contestants
  gather_facts: false
  become: true
  vars_prompt:
    - name: command_to_run
      prompt: "Enter the shell command to execute"
      private: false
  tasks:
    - name: Execute the given command
      ansible.builtin.shell: "{{ command_to_run }}"
      register: command_output

    - name: Display the command output
      ansible.builtin.debug:
        msg:
          stdout: "{{ command_output.stdout_lines }}"
          stderr: "{{ command_output.stderr_lines }}"
