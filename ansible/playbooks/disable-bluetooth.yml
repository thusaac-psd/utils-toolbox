---
- name: Disable Bluetooth service
  hosts: contestants
  gather_facts: false
  become: true
  tasks:
    - name: Gather installed services
      ansible.builtin.service_facts:

    - name: Stop the Bluetooth service
      ansible.builtin.systemd_service:
        name: bluetooth.service
        state: stopped
      when: ansible_facts.services.get('bluetooth.service', {}).get('status', 'not-found') != 'not-found'

    - name: Disable the Bluetooth service
      ansible.builtin.systemd_service:
        name: bluetooth.service
        enabled: false
      when: ansible_facts.services.get('bluetooth.service', {}).get('status', 'not-found') not in ['not-found', 'masked', 'static']

    - name: Mask the Bluetooth service
      ansible.builtin.systemd_service:
        name: bluetooth.service
        masked: true
      when: ansible_facts.services.get('bluetooth.service', {}).get('status', 'not-found') != 'not-found'
