---
- name: Configure a local hosts-file mapping
  hosts: contestants
  gather_facts: false
  become: true
  vars_prompt:
    - name: target_ip
      prompt: "Enter the target IP address (e.g. 192.0.2.20)"
      private: false
    - name: target_hostname
      prompt: "Enter the hostname (e.g. domjudge.example)"
      private: false
  tasks:
    - name: Read the current hosts file
      ansible.builtin.slurp:
        src: /etc/hosts
      register: current_hosts

    - name: Update the exact hostname while preserving other aliases and comments
      ansible.builtin.copy:
        dest: /etc/hosts
        content: "{{ current_hosts.content | b64decode | contest_update_hosts_file(target_ip, target_hostname) }}"
