---
- name: Configure a local hosts-file mapping
  hosts: contestants
  gather_facts: false
  become: true
  vars_prompt:
    - name: target_ip
      prompt: "Enter the target IP address (e.g. 192.0.2.20)"
      private: false
    - name: target_hostname
      prompt: "Enter the hostname (e.g. domjudge.example)"
      private: false
  tasks:
    - name: Map the hostname in /etc/hosts, replacing any line that already lists it
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^[^#]*\s{{ target_hostname | regex_escape }}(\s|$)'
        line: "{{ target_ip }} {{ target_hostname }}"
