---
- name: Create a new standard user
  hosts: all
  become: true
  vars_prompt:
    - name: new_username
      prompt: "Enter the new username"
      private: no
    - name: new_user_password
      prompt: "Enter the password for the new user"
      private: yes # 'yes' hides the password as you type

  tasks:
    - name: "Create user '{{ new_username }}'"
      ansible.builtin.user:
        name: "{{ new_username }}"
        password: "{{ new_user_password | password_hash('sha512') }}"
        state: present
        shell: /bin/bash
        create_home: true
